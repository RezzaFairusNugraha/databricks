services:
  csv-tidy:
    build:
      context: .
      dockerfile: Dockerfile
    image: csv-tidy:latest
    container_name: csv-tidy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - csv_tidy_settings:/app/data
      - csv_tidy_jobs:/app/.data

volumes:
  csv_tidy_settings:
    driver: local
  csv_tidy_jobs:
    driver: local
